name: CI/CD

# Forgejo Actions (git.cu3rd.ru, раннеры организации cu3rd).
# pull_request: тесты.
# push в master: тесты, образы, деплой на dev.
# Prod — вручную: Actions → CI/CD → Run workflow (ветка master) с галочкой deploy_prod;
# прогон собирает и выкатывает текущий master сначала на dev, затем на prod.
# Деплой = смена тега образа в pxc1984/homelab (apps/musicclub-<env>-{backend,frontend}/values.yaml),
# дальше Argo CD выкатывает сам. Конфигурация и секреты окружений живут там же (Sealed Secrets).
#
# Образы — в реестре Forgejo: git.cu3rd.ru/cu3rd/musicclub-{backend,frontend}:<sha>.
# Пушит служебный пользователь cu3rd-ci: переменная организации REGISTRY_USER, секрет организации REGISTRY_TOKEN.
# Секрет репозитория HOMELAB_DEPLOY_KEY — deploy key с записью в pxc1984/homelab
# (один на dev и prod: окружений с отдельными секретами в Forgejo Actions нет).

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      deploy_prod:
        description: 'Deploy to prod (after dev)'
        type: boolean
        default: false

# PR: новый пуш отменяет старый прогон. master: у каждого прогона своя группа, деплой не обрывается.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  REGISTRY: git.cu3rd.ru

jobs:
  test:
    name: Run tests
    # Метка раннеров с dockerd; полный образ catthehacker — на «голых» ubuntu-latest может не оказаться dotnet-зависимостей
    runs-on: homelab-docker
    container:
      image: ghcr.io/catthehacker/ubuntu@sha256:62d572b92f9f32d3427b6d220ad1f9dca9c7b6ffad37d295425037dbff78abaf
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Джоба в контейнере: сервис доступен по имени
      ConnectionStrings__CuMusicClubDb: "Server=postgres;Port=5432;Database=db;Username=admin;Password=password"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      # Только restore: сохранение ~900 МБ кеша занимает ~2 мин, его делает отдельный шаг на master
      - name: Restore NuGet cache
        id: nuget-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        # Build запускает приложение (генерация OpenAPI) и инициализирует БД
        run: dotnet build --no-restore --configuration Release

      - name: Save NuGet cache
        if: steps.nuget-cache.outputs.cache-hit != 'true' && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props') }}

      - name: Run unit tests (Domain)
        run: dotnet test tests/Domain.UnitTests --no-build --configuration Release --logger "trx;LogFileName=test-results-domain.trx" --verbosity minimal

      - name: Run unit tests (Application)
        run: dotnet test tests/Application.UnitTests --no-build --configuration Release --logger "trx;LogFileName=test-results-application.trx" --verbosity minimal

      # TEMPORARY: отключено до появления TEST_NET_SECRETS в Forgejo — вернуть if: убрать
      - name: Setup .NET user secrets
        if: false
        run: |
          mkdir -p ~/.microsoft/usersecrets/a23eb711-3d7c-49a8-a6c6-409a4e03fd21
          echo '${{ secrets.TEST_NET_SECRETS }}' > ~/.microsoft/usersecrets/a23eb711-3d7c-49a8-a6c6-409a4e03fd21/secrets.json

      # TEMPORARY: отключено до появления TEST_NET_SECRETS в Forgejo — вернуть if: убрать
      - name: Run integration tests
        if: false
        run: dotnet test tests/Infrastructure.IntegrationTests --no-build --configuration Release --logger "trx;LogFileName=test-results-integration.trx" --verbosity minimal
        env:
          ASPNETCORE_ENVIRONMENT: Development

      - name: Upload test results
        if: always()
        # v4 не поддерживается в Forgejo (GHES-ограничение); v3 работает
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: |
            tests/**/TestResults/**/*.trx
          retention-days: 30

  build:
    name: Build and push ${{ matrix.image }} image
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: homelab-docker
    container:
      image: ghcr.io/catthehacker/ubuntu@sha256:62d572b92f9f32d3427b6d220ad1f9dca9c7b6ffad37d295425037dbff78abaf
    timeout-minutes: 30
    strategy:
      matrix:
        image: [ backend, frontend ]
    env:
      IMAGE: git.cu3rd.ru/${{ github.repository_owner }}/musicclub-${{ matrix.image }}

    steps:
      - uses: actions/checkout@v4

      # Драйвер docker: сборка идёт в dockerd раннера, слои кэшируются на его томе между запусками
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy-dev:
    name: Deploy to dev
    needs: build
    runs-on: homelab-docker
    container:
      image: ghcr.io/catthehacker/ubuntu@sha256:62d572b92f9f32d3427b6d220ad1f9dca9c7b6ffad37d295425037dbff78abaf
    timeout-minutes: 15
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false

      - name: Checkout homelab
        uses: actions/checkout@v4
        with:
          github-server-url: https://github.com
          repository: pxc1984/homelab
          ssh-key: ${{ secrets.HOMELAB_DEPLOY_KEY }}
          path: homelab

      - name: Publish dev image tags to GitOps
        run: source/scripts/deploy-images.sh homelab dev "${{ github.sha }}"

  deploy-prod:
    name: Deploy to prod
    needs: deploy-dev
    if: github.event_name == 'workflow_dispatch' && (inputs.deploy_prod == true || inputs.deploy_prod == 'true')
    runs-on: homelab-docker
    container:
      image: ghcr.io/catthehacker/ubuntu@sha256:62d572b92f9f32d3427b6d220ad1f9dca9c7b6ffad37d295425037dbff78abaf
    timeout-minutes: 15
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false

      - name: Checkout homelab
        uses: actions/checkout@v4
        with:
          github-server-url: https://github.com
          repository: pxc1984/homelab
          ssh-key: ${{ secrets.HOMELAB_DEPLOY_KEY }}
          path: homelab

      - name: Publish prod image tags to GitOps
        run: source/scripts/deploy-images.sh homelab prod "${{ github.sha }}"
