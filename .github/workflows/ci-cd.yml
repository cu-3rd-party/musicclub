name: CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

# PRs: newer pushes cancel older runs. master: every run gets its own group, so a run
# waiting for prod approval never blocks or gets cancelled by the next push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/musicclub-backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/musicclub-frontend

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests (Domain)
        run: dotnet test tests/Domain.UnitTests --no-build --configuration Release --logger "trx;LogFileName=test-results-domain.trx" --verbosity minimal

      - name: Run unit tests (Application)
        run: dotnet test tests/Application.UnitTests --no-build --configuration Release --logger "trx;LogFileName=test-results-application.trx" --verbosity minimal

      - name: Setup .NET user secrets
        run: |
          mkdir -p ~/.microsoft/usersecrets/a23eb711-3d7c-49a8-a6c6-409a4e03fd21
          echo '${{ secrets.TEST_NET_SECRETS }}' > ~/.microsoft/usersecrets/a23eb711-3d7c-49a8-a6c6-409a4e03fd21/secrets.json

      - name: Run integration tests
        run: dotnet test tests/Infrastructure.IntegrationTests --no-build --configuration Release --logger "trx;LogFileName=test-results-integration.trx" --verbosity minimal
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__CuMusicClubDb: "Server=localhost;Port=5432;Database=db;Username=admin;Password=password"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            tests/**/TestResults/**/*.trx
          retention-days: 30

  build:
    name: Build and push images
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: backend
            dockerfile: docker/backend/Dockerfile
            context: .
          - image: frontend
            dockerfile: docker/frontend/Dockerfile
            context: .
    outputs:
      backend-tag: ${{ env.IMAGE_BACKEND }}:${{ env.COMMIT_SHA }}
      frontend-tag: ${{ env.IMAGE_FRONTEND }}:${{ env.COMMIT_SHA }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set commit SHA
        run: echo "COMMIT_SHA=${{ github.sha }}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/musicclub-${{ matrix.image }}:${{ env.COMMIT_SHA }}
          # Layer cache lives in GHCR, not in the 10 GB GitHub Actions cache
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/musicclub-${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/musicclub-${{ matrix.image }}:buildcache,mode=max

  deploy-dev:
    name: Deploy to dev
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
    secrets: inherit

  # Waits on the "prod" environment's required reviewers: the run page shows
  # "Review deployments" -> "Approve and deploy" once dev is deployed.
  deploy-prod:
    name: Deploy to prod
    needs: deploy-dev
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
    secrets: inherit
