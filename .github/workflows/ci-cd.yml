name: CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - prod

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/musicclub-backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/musicclub-frontend

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            **/bin/Release
            **/obj/Release
          key: ${{ runner.os }}-dotnet-build-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-dotnet-build-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests (Domain)
        run: dotnet test tests/Domain.UnitTests --no-build --configuration Release --logger "trx;LogFileName=test-results-domain.trx" --verbosity minimal

      - name: Run unit tests (Application)
        run: dotnet test tests/Application.UnitTests --no-build --configuration Release --logger "trx;LogFileName=test-results-application.trx" --verbosity minimal

      - name: Setup .NET user secrets
        run: |
          mkdir -p ~/.microsoft/usersecrets/a23eb711-3d7c-49a8-a6c6-409a4e03fd21
          echo '${{ secrets.TEST_NET_SECRETS }}' > ~/.microsoft/usersecrets/a23eb711-3d7c-49a8-a6c6-409a4e03fd21/secrets.json

      - name: Run integration tests
        run: dotnet test tests/Infrastructure.IntegrationTests --no-build --configuration Release --logger "trx;LogFileName=test-results-integration.trx" --verbosity minimal
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__CuMusicClubDb: "Server=localhost;Port=5432;Database=db;Username=admin;Password=password"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            tests/**/TestResults/**/*.trx
          retention-days: 30

  build:
    name: Build and push images
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: backend
            dockerfile: docker/backend/Dockerfile
            context: .
          - image: frontend
            dockerfile: docker/frontend/Dockerfile
            context: .
    outputs:
      backend-tag: ${{ env.IMAGE_BACKEND }}:${{ env.COMMIT_SHA }}
      frontend-tag: ${{ env.IMAGE_FRONTEND }}:${{ env.COMMIT_SHA }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set commit SHA
        run: echo "COMMIT_SHA=${{ github.sha }}" >> $GITHUB_ENV

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            **/bin/Release
            **/obj/Release
          key: ${{ runner.os }}-dotnet-build-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-dotnet-build-

      - name: Pre-populate NuGet cache (for Docker build)
        if: matrix.image == 'backend'
        run: dotnet restore src/Web/Web.csproj

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-options: |
            image=moby/buildkit:latest

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/musicclub-${{ matrix.image }}:${{ env.COMMIT_SHA }}
          cache-from: |
            type=gha
            type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/musicclub-${{ matrix.image }}:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/musicclub-${{ matrix.image }}:buildcache,mode=max

  deploy-dev:
    name: Deploy to dev
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug env vars
        env:
          COMMIT_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          echo "COMMIT_SHA=${COMMIT_SHA}"
          echo "GITHUB_REPOSITORY_OWNER=${GITHUB_REPOSITORY_OWNER}"
          echo "GITHUB_ACTOR=${GITHUB_ACTOR}"

      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          ENV_FILE: ${{ secrets.ENV }}
          COMMIT_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts

          # Sync files
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new" \
            docker-compose.yml \
            docker-compose.prod.yml \
            traefik \
            "${USERNAME}@${HOST}:${DEPLOY_PATH}/"

          # Write .env
          printf '%s\n' "$ENV_FILE" | \
            ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=accept-new \
              "${USERNAME}@${HOST}" \
              "cat > '${DEPLOY_PATH}/.env' && chmod 600 '${DEPLOY_PATH}/.env'"

          # Deploy
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=accept-new \
            "${USERNAME}@${HOST}" << EOF
              set -euo pipefail
              export GITHUB_REPOSITORY_OWNER='${GITHUB_REPOSITORY_OWNER}'
              export COMMIT_SHA='${COMMIT_SHA}'
              export GITHUB_ACTOR='${GITHUB_ACTOR}'
              export GITHUB_TOKEN='${GITHUB_TOKEN}'
              export DEPLOY_PATH='${DEPLOY_PATH}'
              cd "${DEPLOY_PATH}"
              docker login ghcr.io -u "${GITHUB_ACTOR}" -p "${GITHUB_TOKEN}" 2>/dev/null
              docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --pull always --remove-orphans
              docker image prune -f
          EOF

  deploy-prod:
    name: Deploy to prod
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug env vars
        env:
          COMMIT_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          echo "COMMIT_SHA=${COMMIT_SHA}"
          echo "GITHUB_REPOSITORY_OWNER=${GITHUB_REPOSITORY_OWNER}"
          echo "GITHUB_ACTOR=${GITHUB_ACTOR}"

      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          ENV_FILE: ${{ secrets.ENV }}
          COMMIT_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts

          # Sync files
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new" \
            docker-compose.yml \
            docker-compose.prod.yml \
            traefik \
            "${USERNAME}@${HOST}:${DEPLOY_PATH}/"

          # Write .env
          printf '%s\n' "$ENV_FILE" | \
            ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=accept-new \
              "${USERNAME}@${HOST}" \
              "cat > '${DEPLOY_PATH}/.env' && chmod 600 '${DEPLOY_PATH}/.env'"

          # Deploy
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=accept-new \
            "${USERNAME}@${HOST}" << EOF
              set -euo pipefail
              export GITHUB_REPOSITORY_OWNER='${GITHUB_REPOSITORY_OWNER}'
              export COMMIT_SHA='${COMMIT_SHA}'
              export GITHUB_ACTOR='${GITHUB_ACTOR}'
              export GITHUB_TOKEN='${GITHUB_TOKEN}'
              export DEPLOY_PATH='${DEPLOY_PATH}'
              cd "${DEPLOY_PATH}"
              docker login ghcr.io -u "${GITHUB_ACTOR}" -p "${GITHUB_TOKEN}" 2>/dev/null
              docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --pull always --remove-orphans
              docker image prune -f
          EOF
