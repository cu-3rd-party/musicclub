name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: 'Environment name (dev or prod)'

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          ENV_FILE: ${{ secrets.ENV }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts

          # Sync files
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new" \
            docker-compose.yml \
            docker-compose.prod.yml \
            traefik \
            "${USERNAME}@${HOST}:${DEPLOY_PATH}/"

          # Write .env
          printf '%s\n' "$ENV_FILE" | \
            ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=accept-new \
              "${USERNAME}@${HOST}" \
              "cat > '${DEPLOY_PATH}/.env' && chmod 600 '${DEPLOY_PATH}/.env'"

          # Deploy
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=accept-new \
            "${USERNAME}@${HOST}" << EOFSH
              set -euo pipefail
              cd "${DEPLOY_PATH}"
              docker login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}" 2>/dev/null
              docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --pull always --remove-orphans
              docker image prune -f
          EOFSH
