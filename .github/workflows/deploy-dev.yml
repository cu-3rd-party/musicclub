name: Deploy dev

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/musicclub-backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/musicclub-frontend

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test tests/Domain.UnitTests tests/Application.UnitTests --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --verbosity normal

      - name: Run integration tests
        run: dotnet test tests/Infrastructure.IntegrationTests --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --verbosity normal
        env:
          ConnectionStrings__CuMusicClubDb: "Server=localhost;Port=5432;Database=db;Username=admin;Password=password"

  build:
    name: Build and push images
    needs: test
    runs-on: ubuntu-latest
    outputs:
      backend-tag: ${{ env.IMAGE_BACKEND }}:${{ env.COMMIT_SHA }}
      frontend-tag: ${{ env.IMAGE_FRONTEND }}:${{ env.COMMIT_SHA }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set commit SHA
        run: echo "COMMIT_SHA=${{ github.sha }}" >> $GITHUB_ENV

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ github.actor }}" --password-stdin

      - name: Check if backend image exists
        id: backend-exists
        run: |
          if docker manifest inspect ${{ env.IMAGE_BACKEND }}:${{ env.COMMIT_SHA }} > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Build and push backend
        if: steps.backend-exists.outputs.exists == 'false'
        run: |
          docker build \
            -f docker/backend/Dockerfile \
            -t ${{ env.IMAGE_BACKEND }}:${{ env.COMMIT_SHA }} \
            .
          docker push ${{ env.IMAGE_BACKEND }}:${{ env.COMMIT_SHA }}

      - name: Check if frontend image exists
        id: frontend-exists
        run: |
          if docker manifest inspect ${{ env.IMAGE_FRONTEND }}:${{ env.COMMIT_SHA }} > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Build and push frontend
        if: steps.frontend-exists.outputs.exists == 'false'
        run: |
          docker build \
            -f docker/frontend/Dockerfile \
            -t ${{ env.IMAGE_FRONTEND }}:${{ env.COMMIT_SHA }} \
            .
          docker push ${{ env.IMAGE_FRONTEND }}:${{ env.COMMIT_SHA }}

  deploy:
    name: Deploy to dev
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          HOST: ${{ secrets.HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sync application
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            docker-compose.yml \
            docker-compose.prod.yml \
            traefik \
            "${USERNAME}@${HOST}:${DEPLOY_PATH}/"

      - name: Write environment
        env:
          ENV_FILE: ${{ secrets.ENV }}
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          printf '%s\n' "$ENV_FILE" | \
            ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=yes \
              "${USERNAME}@${HOST}" \
              "cat > '${DEPLOY_PATH}/.env' && chmod 600 '${DEPLOY_PATH}/.env'"

      - name: Deploy
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          COMMIT_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            -o SendEnv=COMMIT_SHA,GITHUB_REPOSITORY_OWNER,GITHUB_TOKEN,GITHUB_ACTOR \
            "${USERNAME}@${HOST}" << EOF
              set -euo pipefail

              cd "${DEPLOY_PATH}"

              docker login ghcr.io -u "${GITHUB_ACTOR}" -p "${GITHUB_TOKEN}"

              docker compose \
                -f docker-compose.yml \
                -f docker-compose.prod.yml \
                up -d \
                --pull always \
                --remove-orphans

              docker image prune -f
          EOF
