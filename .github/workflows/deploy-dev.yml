name: Deploy dev

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH key
        env:
          host: ${{ secrets.HOST }}
          key: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$key" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$host" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          chmod 700 ~/.ssh

      - name: Sync source
        run: |
          rsync -avz --delete \
            docker-compose.yml \
            src \
            traefik \
            docker \
            CuMusicClub.slnx \
            Directory.Build.props \
            Directory.Packages.props \
            "${{ secrets.USERNAME }}@${{ secrets.HOST }}:${{ secrets.DEPLOY_PATH }}"

      - name: Deploy to VDS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            printf '%s\n' "${{ secrets.ENV }}" > "${{ secrets.DEPLOY_PATH }}/.env"
            cd "${{ secrets.DEPLOY_PATH }}" && docker compose -f docker-compose.yml up -d --build
